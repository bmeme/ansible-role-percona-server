---
scenario:
  test_sequence:
    - dependency
    - cleanup
    - destroy
    - syntax
    - create
    - prepare
    - converge
    # - idempotence
    - side_effect
    - verify
    - cleanup
    - destroy
dependency:
  name: galaxy
  options:
    role-name: bmeme.percona_server
    role-path: ../../
driver:
  name: docker
platforms:
  - name: default
    image: "bmeme/docker-ansible-${MOLECULE_DISTRO:-rockylinux:8.9-2.11}"
    command: "/usr/sbin/init"
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    privileged: true
    cgroupns_mode: host
    pre_build_image: true
provisioner:
  name: ansible
  inventory:
    host_vars:
      localhost:
        ansible_python_interpreter: "{{ ansible_playbook_python }}"
  log: true
  lint:
    name: ansible-lint
    enabled: true
verifier:
  name: ansible
